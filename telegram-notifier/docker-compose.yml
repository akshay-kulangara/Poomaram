services:
  telegram-notifier:
    build: .
    container_name: telegram-notifier
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PORT=3001
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

